name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: policyrag, POSTGRES_PASSWORD: policyrag, POSTGRES_DB: policyrag }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U policyrag" --health-interval 3s --health-retries 20
    env:
      POLICYRAG_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 && uv pip install -e . pytest ruff httpx
      - run: .venv/bin/ruff check .
      - run: .venv/bin/pytest -q
      - run: .venv/bin/python -m policyrag.ingest && .venv/bin/python -m eval.run
