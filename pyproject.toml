[project]
name = "policyrag"
version = "0.1.0"
description = "Cited Q&A over insurance policies: hybrid search, re-ranking, Langfuse traces, MCP server"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pypdf>=5",
  "fpdf2>=2.8",
  "sentence-transformers>=3",
  "google-genai>=1",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "mcp>=1.2",
  "langfuse>=2.50,<3",
  "python-dotenv>=1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policyrag"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "eval"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = ["db: needs a running Postgres with pgvector"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"corpus/generate.py" = ["E501"]
